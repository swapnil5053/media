services:
  adaptflow:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_URL: ${APP_URL:-http://localhost:8000}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env, e.g. openssl rand -hex 32}
    volumes:
      - adaptflow-data:/data
    restart: unless-stopped

volumes:
  adaptflow-data:
